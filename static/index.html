<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Fez-GPT</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh
}
header{
  padding:14px;
  background:#020617;
  text-align:center;
  font-size:20px
}
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px
}
.msg{
  max-width:70%;
  padding:12px 16px;
  border-radius:14px;
  margin-bottom:12px;
  white-space:pre-wrap
}
.user{
  background:#2563eb;
  margin-left:auto
}
.bot{
  background:#1e293b
}
#input{
  display:flex;
  padding:14px;
  background:#020617
}
input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-size:16px
}
button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer
}
</style>
</head>

<body>

<header>Ask Fez-GPT</header>

<div id="chat"></div>

<div id="input">
  <input id="q" placeholder="Type your message..." />
  <button onclick="send()">Send</button>
</div>

<script>
/* ================= SESSION ================= */

// Her sayfa yüklenişinde YENİ session
const SESSION_ID = crypto.randomUUID();

/* ================= UI HELPERS ================= */

const chat = document.getElementById("chat");
const input = document.getElementById("q");

function addMessage(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* ================= SEND ================= */

async function send(initialText=null){
  const text = initialText ?? input.value.trim();
  if(!text) return;

  if(!initialText){
    addMessage(text, "user");
    input.value="";
  }

  const loading = document.createElement("div");
  loading.className="msg bot";
  loading.textContent="Thinking...";
  chat.appendChild(loading);

  try{
    const r = await fetch("/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        question: text,
        session_id: SESSION_ID
      })
    });

    const j = await r.json();
    loading.remove();
    addMessage(j.answer || "No response","bot");

  }catch(e){
    loading.remove();
    addMessage("Server error","bot");
  }
}

/* ================= ENTER KEY ================= */

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});

/* ================= AUTO START ================= */

// Sayfa açılır açılmaz botu başlat
send("hi");

</script>
</body>
</html>
